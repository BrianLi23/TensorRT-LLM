# 1-GPU Qwen-Image with NVFP4 dynamic quantization.
quant_config:
  quant_algo: NVFP4
  dynamic: true
  ignore:
    - "transformer_blocks.0*"
    - "transformer_blocks.1.*"
    - "transformer_blocks.58*"
    - "transformer_blocks.59*"
    - "img_in"
    - "txt_in"
    - "time_text_embed*"
    - "proj_out"
attention_config:
  backend: VANILLA
parallel_config:
  cfg_size: 1
  ulysses_size: 1
cuda_graph_config:
  enable: false
compilation_config:
  # Warm up at 1024x1024 to match the profiled resolution (image seq_len ~4096
  # +text ~4113), matching SGLang. Avoids first-step autotune inside the trace.
  resolutions:
    - [1024, 1024]
  num_frames: [1]
