# 1-GPU Qwen-Image, bf16 (no quantization).
attention_config:
  backend: VANILLA
parallel_config:
  cfg_size: 1
  ulysses_size: 1
torch_compile_config:
  enable: true
cuda_graph_config:
  enable: true
compilation_config:
  # Warm up at 1024x1024 to match the profiled resolution (image seq_len ~4096
  # +text ~4113), matching SGLang. Avoids first-step autotune inside the trace.
  resolutions:
    - [1024, 1024]
  num_frames: [1]
